<div class="appointment-form-wrapper">
  <form (ngSubmit)="onSubmit()" class="appointment-form">
    <div class="row">
      <div class="form-group col-md-6">
        <input type="text" [(ngModel)]="appointment.name" name="name" class="form-control" placeholder="Your Name"
          required>
      </div>
      <div class="form-group col-md-6">
        <input type="email" [(ngModel)]="appointment.email" name="email" class="form-control" placeholder="Your Email"
          required>
      </div>
    </div>
    <div class="row">
      <div class="form-group col-md-6">
        <input type="tel" [(ngModel)]="appointment.phone" name="phone" class="form-control" placeholder="Your Phone"
          required>
      </div>
      <div class="form-group col-md-6">
        <input type="date" [(ngModel)]="appointment.date" name="date" class="form-control" required>
      </div>
    </div>
    <div class="row">
      <div class="form-group col-md-6">
        <select [(ngModel)]="appointment.department" name="department" class="form-control" required>
          <option value="">Select Department</option>
          @for (dept of departments; track $index) {
          <option [value]="dept.id">
            {{ dept.name }}
          </option>
          }
        </select>
      </div>
      <div class="form-group col-md-6">
        <input type="text" [(ngModel)]="appointment.doctor" name="doctor" class="form-control"
          placeholder="Doctor Name (Optional)">
      </div>
    </div>
    <div class="form-group">
      <textarea [(ngModel)]="appointment.message" name="message" class="form-control" rows="5"
        placeholder="Message (Optional)"></textarea>
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="loading || !isFormValid()">
      @if (!loading) {
      <span>Book Appointment</span>
      } @else {
      <span>Processing...</span>
      }
    </button>
  </form>

  @if (submitted) {
  <div class="alert alert-success alert-dismissible fade show" role="alert">
    Your appointment request has been submitted successfully!
    <button type="button" class="btn-close" (click)="submitted = false"></button>
  </div>
  }
</div>
