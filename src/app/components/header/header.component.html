<header id="header" class="header sticky-top">

  <div class="topbar d-flex align-items-center">
    <div class="container d-flex justify-content-center justify-content-md-between">
      <div class="contact-info d-flex align-items-center">
        <i class="bi bi-envelope d-flex align-items-center"><a href="mailto:contact&#64;medilab.com">contact&#64;medilab.com</a></i>
        <i class="bi bi-phone d-flex align-items-center ms-4"><span>+1 5589 55488 55</span></i>
      </div>
      <div class="social-links d-none d-md-flex align-items-center">
        <a href="#" class="twitter"><i class="bi bi-twitter-x"></i></a>
        <a href="#" class="facebook"><i class="bi bi-facebook"></i></a>
        <a href="#" class="instagram"><i class="bi bi-instagram"></i></a>
        <a href="#" class="linkedin"><i class="bi bi-linkedin"></i></a>
      </div>
    </div>
  </div><!-- End Top Bar -->

  <div class="branding d-flex align-items-center">
    <div class="container position-relative d-flex align-items-center justify-content-between">
      <a href="/" class="logo d-flex align-items-center me-auto">
        <h1 class="sitename">Medilab</h1>
      </a>

      <nav id="navmenu" class="navmenu" [class.active]="mobileMenuOpen">
        <ul>
          <li><a href="#hero" (click)="closeMobileMenu()">Home</a></li>
          <li><a href="#about" (click)="closeMobileMenu()">About</a></li>
          <li><a href="#services" (click)="closeMobileMenu()">Services</a></li>
          <li><a href="#departments" (click)="closeMobileMenu()">Departments</a></li>
          <li><a href="#doctors" (click)="closeMobileMenu()">Doctors</a></li>
          <li><a href="#faq" (click)="closeMobileMenu()">FAQ</a></li>
          <li><a href="#contact" (click)="closeMobileMenu()">Contact</a></li>
        </ul>
        <i class="mobile-nav-toggle d-xl-none bi bi-list" (click)="toggleMobileMenu()"></i>
      </nav>

      <div class="d-flex align-items-center gap-2">
        <a class="cta-btn d-none d-sm-block" href="#appointment">Make an Appointment</a>
        <a class="btn btn-outline-primary d-none d-sm-block" routerLink="/login">Login</a>
      </div>

    </div>
  </div>

</header>
