<!-- ================= PAGE HEADER ================= -->
<div class="page-header-card">
  <div class="page-header">
    <div>
      <h2 class="page-title">
        <i class="bi bi-person-vcard-fill"></i>

        Patient Management
      </h2>
      <p class="page-sub">Manage hospital patient records</p>
    </div>
    <div class="header-actions">
      <div class="search-wrapper">
        <i class="bi bi-search"></i>
        <input
          type="text"
          placeholder="Search patient..."
          [(ngModel)]="searchTerm"
        />
      </div>
      <button class="primary-btn" (click)="openAdd()">
        <i class="bi bi-plus-lg"></i>

        Add Patient
      </button>
    </div>
  </div>
</div>

<!-- ================= TABLE ================= -->
<div class="table-card">
  <table class="custom-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Gender</th>
        <th>DOB</th>
        <th>Phone</th>
        <th>Blood</th>
        <th>Status</th>
        <th class="text-center">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of filteredPatients">
        <!-- NAME + AVATAR -->
        <td>
          <div class="name-cell">
            <div class="avatar pink">
              {{ p.name.charAt(0) }}
            </div>
            <span>{{ p.name }}</span>
          </div>
        </td>
        <td>{{ p.gender }}</td>
        <td>{{ p.dob }}</td>
        <td>{{ p.phone }}</td>
        <td>{{ p.bloodGroup }}</td>
        <td>
          <span
            class="status-badge"
            [ngClass]="p.status === 'Active' ? 'active' : 'inactive'"
          >
            {{ p.status }}
          </span>
        </td>
        <td class="actions">
          <button class="icon-btn edit" (click)="openEdit(p)">
            <i class="bi bi-pencil"></i>
          </button>
          <button class="icon-btn delete" (click)="deletePatient(p.id)">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- ================= MODAL ================= -->
<div class="modal-overlay" *ngIf="showForm">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-icon">
        <i class="bi bi-person-plus-fill"></i>
      </div>
      <h3>{{ editMode ? "Edit Patient" : "Add Patient" }}</h3>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>Full Name</label>
        <input [(ngModel)]="newPatient.name" />
      </div>
      <div class="form-group">
        <label>Gender</label>
        <select [(ngModel)]="newPatient.gender">
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" [(ngModel)]="newPatient.dob" />
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input [(ngModel)]="newPatient.phone" />
      </div>
      <div class="form-group">
        <label>Address</label>
        <input [(ngModel)]="newPatient.address" />
      </div>
      <div class="form-group">
        <label>Blood Group</label>
        <select [(ngModel)]="newPatient.bloodGroup">
          <option value="">Select Blood</option>
          <option>A+</option>
          <option>A-</option>
          <option>B+</option>
          <option>B-</option>
          <option>AB+</option>
          <option>AB-</option>
          <option>O+</option>
          <option>O-</option>
        </select>
      </div>
      <div class="form-group">
        <label>Emergency Contact</label>
        <input [(ngModel)]="newPatient.emergencyContact" />
      </div>
      <div class="form-group">
        <label>Status</label>
        <select [(ngModel)]="newPatient.status">
          <option value="Active">Active</option>
          <option value="Discharged">Discharged</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="primary-btn" (click)="savePatient()">Save</button>
      <button class="outline-btn" (click)="closeForm()">Cancel</button>
    </div>
  </div>
</div>
